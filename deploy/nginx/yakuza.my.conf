server {
    listen 80;
    server_name yakuza.my www.yakuza.my;

    root /var/www/yakuza.my/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name acsr.ro www.acsr.ro;

    return 301 https://yakuza.my$request_uri;
}